<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-labelledby="p1t p1d">
  <title id="p1t">三色套印样张</title>
  <desc id="p1d">米色纸面上，一方赤陶色块与一方橄榄色块错位交叠，右下压着半调网点，右上有一圈细线，底部排着四格印刷色标。</desc>

  <defs>
    <pattern id="halftone" width="13" height="13" patternUnits="userSpaceOnUse">
      <circle cx="6.5" cy="6.5" r="3.1" fill="#1B1815" opacity="0.42"/>
    </pattern>
    <pattern id="squaregrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 V40 H0" fill="none" stroke="#1B1815" stroke-width="0.6" opacity="0.16"/>
    </pattern>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="plate">
      <rect x="112" y="152" width="512" height="512"/>
    </clipPath>
  </defs>

  <rect width="800" height="1000" fill="#EAE0CA"/>

  <!-- 淡网格 -->
  <rect x="60" y="100" width="680" height="700" fill="url(#squaregrid)" opacity="0.75"/>

  <!-- 橄榄版（错位） -->
  <g style="mix-blend-mode:multiply" opacity="0.92">
    <rect x="130" y="176" width="512" height="512" fill="#4F5741" transform="rotate(-2 386 432)"/>
  </g>

  <!-- 赤陶版 -->
  <rect x="112" y="152" width="512" height="512" fill="#A9462C" transform="rotate(-2 368 408)"/>

  <!-- 半调网点压在色块右下 -->
  <g clip-path="url(#plate)">
    <rect x="380" y="380" width="300" height="300" fill="url(#halftone)"/>
  </g>

  <!-- 细线圆 -->
  <circle cx="612" cy="232" r="84" fill="none" stroke="#1B1815" stroke-width="1"/>

  <!-- 色标 -->
  <g>
    <rect x="112" y="812" width="26" height="26" fill="#A9462C"/>
    <rect x="146" y="812" width="26" height="26" fill="#4F5741"/>
    <rect x="180" y="812" width="26" height="26" fill="#1B1815"/>
    <rect x="214" y="812" width="26" height="26" fill="#F5F0E6" stroke="#1B1815" stroke-width="0.8"/>
    <rect x="248" y="812" width="26" height="26" fill="#C9BBA0"/>
  </g>

  <!-- 细线 -->
  <line x1="112" y1="880" x2="688" y2="880" stroke="#1B1815" stroke-width="1" opacity="0.55"/>
  <line x1="112" y1="768" x2="688" y2="768" stroke="#1B1815" stroke-width="1" opacity="0.25"/>

  <!-- 纸纹 -->
  <rect width="800" height="1000" filter="url(#paper)" opacity="0.14" style="mix-blend-mode:multiply"/>
</svg>
