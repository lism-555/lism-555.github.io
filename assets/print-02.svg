<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-labelledby="p2t p2d">
  <title id="p2t">四色试印条</title>
  <desc id="p2d">米色纸面上并排四条色带，赤陶与橄榄的边线上压着半调网点，右侧有一处错位的套印重影。</desc>

  <defs>
    <pattern id="ht2" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="2.4" fill="#1B1815" opacity="0.38"/>
    </pattern>
    <filter id="paper2" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1000" height="620" fill="#EAE0CA"/>

  <!-- 四条色带 -->
  <rect x="80" y="120" width="150" height="380" fill="#A9462C"/>
  <rect x="248" y="120" width="150" height="380" fill="#4F5741"/>
  <rect x="416" y="120" width="150" height="380" fill="#1B1815"/>
  <rect x="584" y="120" width="150" height="380" fill="#C9BBA0"/>

  <!-- 错位套印重影 -->
  <rect x="752" y="120" width="150" height="380" fill="#A9462C" opacity="0.55"/>
  <rect x="766" y="136" width="150" height="380" fill="#4F5741" opacity="0.55" style="mix-blend-mode:multiply"/>

  <!-- 网点压在交界 -->
  <rect x="300" y="300" width="320" height="200" fill="url(#ht2)"/>

  <!-- 细线 -->
  <line x1="80" y1="530" x2="916" y2="530" stroke="#1B1815" stroke-width="1" opacity="0.5"/>
  <line x1="80" y1="82" x2="916" y2="82" stroke="#1B1815" stroke-width="1" opacity="0.25"/>

  <!-- 十字规矩线 -->
  <g stroke="#1B1815" stroke-width="0.8" opacity="0.45">
    <line x1="60" y1="60" x2="86" y2="60"/>
    <line x1="73" y1="47" x2="73" y2="73"/>
    <line x1="914" y1="560" x2="940" y2="560"/>
    <line x1="927" y1="547" x2="927" y2="573"/>
  </g>

  <rect width="1000" height="620" filter="url(#paper2)" opacity="0.14" style="mix-blend-mode:multiply"/>
</svg>
