<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">复古多巴胺插画：笑脸太阳、花朵与波浪</title>
  <desc id="heroDesc">橙粉紫渐变的天空里有一轮带笑脸的黄色太阳，周围是放射状光芒。下方是青绿与紫色的波浪带，底部铺着黑黄棋盘，点缀着粉色花朵和黄色星星。</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF9A3D"/>
      <stop offset="46%" stop-color="#FF4E7A"/>
      <stop offset="100%" stop-color="#7B3BF5"/>
    </linearGradient>

    <pattern id="checker" width="120" height="120" patternUnits="userSpaceOnUse" patternTransform="skewX(-18)">
      <rect width="120" height="120" fill="#FFD23F"/>
      <rect width="60" height="60" fill="#1B0F2B"/>
      <rect x="60" y="60" width="60" height="60" fill="#1B0F2B"/>
    </pattern>

    <g id="petal">
      <ellipse cx="0" cy="-52" rx="27" ry="52" fill="#FF3D7F" stroke="#1B0F2B" stroke-width="7"/>
    </g>

    <g id="flower">
      <use href="#petal"/>
      <use href="#petal" transform="rotate(72)"/>
      <use href="#petal" transform="rotate(144)"/>
      <use href="#petal" transform="rotate(216)"/>
      <use href="#petal" transform="rotate(288)"/>
      <circle r="30" fill="#FFD23F" stroke="#1B0F2B" stroke-width="7"/>
    </g>

    <path id="spark" d="M0-46C8-14 14-8 46 0C14 8 8 14 0 46C-8 14-14 8-46 0C-14-8-8-14 0-46Z" fill="#FFD23F" stroke="#1B0F2B" stroke-width="7" stroke-linejoin="round"/>

    <g id="ray">
      <rect x="-11" y="-336" width="22" height="86" rx="11" fill="#FFD23F" stroke="#1B0F2B" stroke-width="7"/>
    </g>
  </defs>

  <rect width="1200" height="900" fill="url(#sky)"/>

  <!-- 放射光芒 -->
  <g transform="translate(600,410)">
    <use href="#ray" transform="rotate(0)"/>
    <use href="#ray" transform="rotate(30)"/>
    <use href="#ray" transform="rotate(60)"/>
    <use href="#ray" transform="rotate(90)"/>
    <use href="#ray" transform="rotate(120)"/>
    <use href="#ray" transform="rotate(150)"/>
    <use href="#ray" transform="rotate(180)"/>
    <use href="#ray" transform="rotate(210)"/>
    <use href="#ray" transform="rotate(240)"/>
    <use href="#ray" transform="rotate(270)"/>
    <use href="#ray" transform="rotate(300)"/>
    <use href="#ray" transform="rotate(330)"/>
  </g>

  <!-- 太阳 -->
  <circle cx="600" cy="410" r="188" fill="#FFD23F" stroke="#1B0F2B" stroke-width="9"/>
  <ellipse cx="532" cy="382" rx="16" ry="27" fill="#1B0F2B"/>
  <ellipse cx="668" cy="382" rx="16" ry="27" fill="#1B0F2B"/>
  <path d="M508 458 Q600 556 692 458" fill="none" stroke="#1B0F2B" stroke-width="13" stroke-linecap="round"/>
  <circle cx="470" cy="450" r="17" fill="#FF6B2C" opacity="0.85"/>
  <circle cx="730" cy="450" r="17" fill="#FF6B2C" opacity="0.85"/>

  <!-- 小圆点 -->
  <g fill="#FFD23F" opacity="0.9">
    <circle cx="160" cy="120" r="9"/>
    <circle cx="205" cy="120" r="9"/>
    <circle cx="250" cy="120" r="9"/>
    <circle cx="950" cy="140" r="9"/>
    <circle cx="995" cy="140" r="9"/>
    <circle cx="1040" cy="140" r="9"/>
  </g>

  <!-- 星星 -->
  <use href="#spark" transform="translate(250,290) scale(0.7)"/>
  <use href="#spark" transform="translate(960,300) scale(0.95)"/>
  <use href="#spark" transform="translate(1080,470) scale(0.55)"/>

  <!-- 青色波浪 -->
  <path d="M0,690 C120,624 240,624 360,690 C480,756 600,756 720,690 C840,624 960,624 1080,690 C1140,722 1172,732 1200,722 L1200,832 L0,832 Z"
        fill="#0FC2A5" stroke="#1B0F2B" stroke-width="9" stroke-linejoin="round"/>

  <!-- 紫色波浪 -->
  <path d="M0,762 C120,700 240,700 360,762 C480,824 600,824 720,762 C840,700 960,700 1080,762 C1140,792 1172,800 1200,792 L1200,832 L0,832 Z"
        fill="#6B3BF5" stroke="#1B0F2B" stroke-width="9" stroke-linejoin="round"/>

  <!-- 棋盘地面 -->
  <rect x="0" y="830" width="1200" height="70" fill="url(#checker)"/>
  <line x1="0" y1="834" x2="1200" y2="834" stroke="#1B0F2B" stroke-width="9"/>

  <!-- 花朵 -->
  <use href="#flower" transform="translate(160,600) scale(0.95) rotate(-8)"/>
  <use href="#flower" transform="translate(1020,620) scale(1.12) rotate(12)"/>
  <use href="#flower" transform="translate(430,760) scale(0.62) rotate(20)"/>
  <use href="#flower" transform="translate(760,780) scale(0.5) rotate(-14)"/>
</svg>
